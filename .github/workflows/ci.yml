name: CI

# Runs on every pull request and on main. The web, api and ml jobs switch
# themselves on as soon as their part of the repository exists, so CI grows with
# the code without anyone editing this file. Until then they report that there
# is nothing to check yet and pass.
#
# No provider keys are given to CI and GATEWAY_MODE is replay: a test that tries
# to call a live model fails instead of spending the budget.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GATEWAY_MODE: replay
  DEMO_MODE: "false"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.part.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present lint
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present typecheck
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present test
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present build

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invision
          POSTGRES_PASSWORD: invision
          POSTGRES_DB: invision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://invision:invision@localhost:5432/invision
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f apps/api/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/api does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.part.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present lint
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present typecheck
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present test
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present build

  ml:
    name: ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f services/ml/pyproject.toml ] || [ -f services/ml/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "services/ml does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.part.outputs.present == 'true'
        working-directory: services/ml
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt;
          elif [ -f pyproject.toml ]; then pip install -e ".[dev]";
          else pip install -r requirements.txt; fi
      - if: steps.part.outputs.present == 'true'
        working-directory: services/ml
        run: python -m pytest -q

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [api, ml]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invision
          POSTGRES_PASSWORD: invision
          POSTGRES_DB: invision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The pitch path, as the demo runs it: seed shortcuts on, every model answer replayed, no keys.
      DEMO_MODE: "true"
      GATEWAY_MODE: replay
      DATABASE_URL: postgresql://invision:invision@localhost:5432/invision
      ML_INTERNAL_TOKEN: e2e-internal-token
      API_KEYS: local-platform:platform,local-interviewer:interviewer,local-commission:commission,local-admin:admin
      UPLOADS_DIR: /tmp/e2e/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg, for the interview recording's length
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r services/ml/requirements.txt
      - name: Build the API and migrate
        working-directory: apps/api
        run: |
          pnpm run build
          pnpm exec prisma migrate deploy
      - name: Start ML and the API
        run: |
          mkdir -p /tmp/e2e/uploads
          PYTHONPATH="$PWD:$PWD/services/ml" BUDGET_USD_CAP=1 USAGE_LOG_PATH=/tmp/e2e/usage.jsonl \
            nohup python -m uvicorn services.ml.main:app --host 127.0.0.1 --port 8000 > /tmp/e2e/ml.log 2>&1 &
          (cd apps/api && ML_SERVICE_URL=http://127.0.0.1:8000 PORT=3001 nohup node dist/main.js > /tmp/e2e/api.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/v1/health >/dev/null && curl -sf -H "X-Internal-Token: $ML_INTERNAL_TOKEN" http://127.0.0.1:8000/internal/v1/health >/dev/null && exit 0
            sleep 2
          done
          echo "The stack did not come up"; tail -50 /tmp/e2e/ml.log /tmp/e2e/api.log; exit 1
      - name: Walk the pitch path
        run: API=http://127.0.0.1:3001/v1 node scripts/e2e/pitch-path.mjs
      - if: failure()
        run: tail -100 /tmp/e2e/ml.log /tmp/e2e/api.log
