name: CI

# Runs on every pull request and on main. The web, api and ml jobs switch
# themselves on as soon as their part of the repository exists, so CI grows with
# the code without anyone editing this file. Until then they report that there
# is nothing to check yet and pass.
#
# No provider keys are given to CI and GATEWAY_MODE is replay: a test that tries
# to call a live model fails instead of spending the budget.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GATEWAY_MODE: replay
  DEMO_MODE: "false"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.part.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present lint
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present typecheck
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present test
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/web run --if-present build

  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: invision
          POSTGRES_PASSWORD: invision
          POSTGRES_DB: invision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://invision:invision@localhost:5432/invision
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f apps/api/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/api does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.part.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present lint
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present typecheck
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present test
      - if: steps.part.outputs.present == 'true'
        run: pnpm --filter ./apps/api run --if-present build

  ml:
    name: ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: part
        run: |
          if [ -f services/ml/pyproject.toml ] || [ -f services/ml/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "services/ml does not exist yet — nothing to check."
          fi
      - if: steps.part.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: steps.part.outputs.present == 'true'
        working-directory: services/ml
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt;
          elif [ -f pyproject.toml ]; then pip install -e ".[dev]";
          else pip install -r requirements.txt; fi
      - if: steps.part.outputs.present == 'true'
        working-directory: services/ml
        run: python -m pytest -q
