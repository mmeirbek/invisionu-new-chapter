    S3InternalError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              const: INTERNAL_ERROR
    RegisterApplicantRequest:
      type: object
      additionalProperties: false
      required: [email, iin, fullName, birthYear, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase before uniqueness checks.
        iin:
          type: string
          pattern: '^[0-9]{12}$'
          description: |
            Synthetic 12-digit IIN for pitch data. The API validates format only;
            it does not perform government identity verification. Never returned or
            written to routine logs.
        fullName:
          type: string
          minLength: 2
          maxLength: 120
          description: Trimmed single display-name field; no first/last-name parsing is imposed.
        birthYear:
          type: integer
          minimum: 1900
          x-server-validation: birthYear <= currentCalendarYear - 18
          description: |
            Identity data, excluded from scoring. The server requires a year no
            later than the current calendar year minus 18; exact birthday validation
            is impossible without collecting a full birth date.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: Single-factor passphrase; no character-composition rule.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and normalized to lowercase before lookup.
        password:
          type: string
          format: password
          writeOnly: true
    UserPublic:
      type: object
      additionalProperties: false
      required: [id, email, fullName, role, createdAt]
      example:
        id: 33333333-3333-4333-8333-333333333333
        email: applicant@example.test
        fullName: Demo Applicant
        role: APPLICANT
        createdAt: '2026-09-17T12:00:00Z'
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          description: Account creation time. Birth year and IIN are never returned.
    Role:
      type: string
      enum: [APPLICANT, INTERVIEWER, ADMISSION_COMMISSION, METHODOLOGY_OWNER, SYSTEM_ADMIN]
    AuthSession:
      type: object
      additionalProperties: false
      required: [user, accessExpiresAt]
      example:
        user:
          id: 33333333-3333-4333-8333-333333333333
          email: applicant@example.test
          fullName: Demo Applicant
          role: APPLICANT
          createdAt: '2026-09-17T12:00:00Z'
        accessExpiresAt: '2026-09-17T12:15:00Z'
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        accessExpiresAt:
          type: string
          format: date-time
          description: Expiry time of the access cookie. The refresh token remains HttpOnly.
    ActiveCycle:
      type: object
      additionalProperties: false
      required: [id, name, formVersion]
      example:
        id: 11111111-1111-4111-8111-111111111111
        name: Synthetic pitch cycle
        formVersion:
          id: 22222222-2222-4222-8222-222222222222
          version: 1
          title: Synthetic applicant profile
          description: Synthetic, non-scoring factual demo form; not official admissions methodology.
          publishedAt: '2026-09-17T12:00:00Z'
          questions:
            - id: current_education_status
              label: Current education status
              type: SINGLE_SELECT
              required: false
              options:
                - value: secondary_school
                  label: Secondary school
                - value: technical_vocational
                  label: Technical or vocational college
                - value: undergraduate
                  label: Undergraduate programme
                - value: graduate
                  label: Graduate programme
                - value: other
                  label: Other
            - id: intended_study_area
              label: Intended study area or specialty
              type: TEXT
              required: false
              constraints:
                maxLength: 160
            - id: expected_graduation_year
              label: Expected graduation year
              type: NUMBER
              required: false
              constraints:
                minimum: 1900
                maximum: 2100
            - id: city_region
              label: Current city or region
              helpText: Reference information only; it is not used for scoring.
              type: TEXT
              required: false
              constraints:
                maxLength: 160
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        formVersion:
          $ref: '#/components/schemas/FormVersion'
    FormVersion:
      type: object
      additionalProperties: false
      required: [id, version, title, publishedAt, questions]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        publishedAt:
          type: string
          format: date-time
        questions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FormQuestion'
    FormQuestion:
      type: object
      additionalProperties: false
      required: [id, label, type, required]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: Stable within a form version and used as the answer key.
        label:
          type: string
          minLength: 1
          maxLength: 300
        type:
          type: string
          enum: [TEXT, TEXTAREA, NUMBER, DATE, SINGLE_SELECT, MULTI_SELECT]
        required:
          type: boolean
          description: Enforced during S5 submission, not partial S2 draft saves.
        helpText:
          type: string
          maxLength: 1000
        constraints:
          $ref: '#/components/schemas/FormQuestionConstraints'
        options:
          type: array
          minItems: 2
          maxItems: 100
          description: Required only for SINGLE_SELECT and MULTI_SELECT questions.
          items:
            $ref: '#/components/schemas/FormOption'
    FormQuestionConstraints:
      type: object
      additionalProperties: false
      description: |
        Only constraints applicable to the question type are allowed. The server
        validates range ordering and configured safety limits before publication.
      properties:
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 1
        minimum:
          type: number
        maximum:
          type: number
        minDate:
          type: string
          format: date
        maxDate:
          type: string
          format: date
        minSelections:
          type: integer
          minimum: 0
        maxSelections:
          type: integer
          minimum: 1
    FormOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$'
          description: Stable value stored in application answers.
        label:
          type: string
          minLength: 1
          maxLength: 200
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required: [cycleId]
      properties:
        cycleId:
          type: string
          format: uuid
    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PROCESSING, PROCESSING_FAILED, COMMISSION_REVIEW, DECIDED]
    ApplicationDraft:
      type: object
      additionalProperties: false
      required: [id, cycleId, formVersion, status, revision, answers, createdAt, updatedAt]
      example:
        id: 55555555-5555-4555-8555-555555555555
        cycleId: 11111111-1111-4111-8111-111111111111
        formVersion:
          id: 22222222-2222-4222-8222-222222222222
          version: 1
          title: Synthetic applicant profile
          description: Synthetic, non-scoring factual demo form; not official admissions methodology.
          publishedAt: '2026-09-17T12:00:00Z'
          questions:
            - id: current_education_status
              label: Current education status
              type: SINGLE_SELECT
              required: false
              options:
                - value: secondary_school
                  label: Secondary school
                - value: technical_vocational
                  label: Technical or vocational college
                - value: undergraduate
                  label: Undergraduate programme
                - value: graduate
                  label: Graduate programme
                - value: other
                  label: Other
            - id: intended_study_area
              label: Intended study area or specialty
              type: TEXT
              required: false
              constraints:
                maxLength: 160
            - id: expected_graduation_year
              label: Expected graduation year
              type: NUMBER
              required: false
              constraints:
                minimum: 1900
                maximum: 2100
            - id: city_region
              label: Current city or region
              helpText: Reference information only; it is not used for scoring.
              type: TEXT
              required: false
              constraints:
                maxLength: 160
        status: DRAFT
        revision: 4
        answers:
          current_education_status: undergraduate
          intended_study_area: Product management
          expected_graduation_year: 2027
          city_region: Almaty
        createdAt: '2026-09-17T12:05:00Z'
        updatedAt: '2026-09-17T12:10:00Z'
      properties:
        id:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        formVersion:
          $ref: '#/components/schemas/FormVersion'
        status:
          allOf:
            - $ref: '#/components/schemas/ApplicationStatus'
            - type: string
              const: DRAFT
          description: S2 application-draft operations return only DRAFT applications.
        revision:
          type: integer
          minimum: 0
        answers:
          $ref: '#/components/schemas/DraftAnswers'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StoredAnswerValue:
      description: |
        Stored shape selected by the bound question type: string for text, date,
        or single-select; number for NUMBER; unique string array for MULTI_SELECT.
        The server validates the value against the bound question definition.
      oneOf:
        - type: string
        - type: number
        - type: array
          uniqueItems: true
          items:
            type: string
    DraftAnswers:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/StoredAnswerValue'
      description: Stored non-null values keyed by question ID.
    DraftAnswerPatchValue:
      description: A stored answer value, or null to remove the existing answer.
      oneOf:
        - $ref: '#/components/schemas/StoredAnswerValue'
        - type: 'null'
    DraftAnswerPatch:
      type: object
      minProperties: 1
      additionalProperties:
        $ref: '#/components/schemas/DraftAnswerPatchValue'
    SaveAnswersRequest:
      type: object
      additionalProperties: false
      required: [formVersionId, expectedRevision, answers]
      properties:
        formVersionId:
          type: string
          format: uuid
          description: Must match the immutable form version bound to the draft.
        expectedRevision:
          type: integer
          minimum: 0
          description: Last server revision observed by the client.
        answers:
          $ref: '#/components/schemas/DraftAnswerPatch'
    TestBlockId:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      description: Stable neutral block identifier; it must not encode a competency or weight.
    TestStatementId:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      description: Stable neutral statement identifier; it must not encode a competency or weight.
    TestVersionSummary:
      type: object
      additionalProperties: false
      required: [id, version, title, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        publishedAt:
          type: string
          format: date-time
      description: Public metadata only. Test blocks, competency mappings and weights are excluded.
    TestAttemptStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED]
    TestAttemptSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - applicationId
        - testVersion
        - status
        - totalBlocks
        - answeredBlocks
        - timedOutBlocks
        - currentBlockNumber
        - revision
        - startedAt
        - completedAt
      example:
        id: 77777777-7777-4777-8777-777777777777
        applicationId: 55555555-5555-4555-8555-555555555555
        testVersion:
          id: 66666666-6666-4666-8666-666666666666
          version: 1
          title: Synthetic forced-choice demo
          description: Synthetic prototype content; not validated admissions science.
          publishedAt: '2026-09-21T00:00:00Z'
        status: IN_PROGRESS
        totalBlocks: 10
        answeredBlocks: 0
        timedOutBlocks: 0
        currentBlockNumber: 1
        revision: 0
        startedAt: '2026-09-21T00:05:00Z'
        completedAt: null
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        testVersion:
          $ref: '#/components/schemas/TestVersionSummary'
        status:
          $ref: '#/components/schemas/TestAttemptStatus'
        totalBlocks:
          type: integer
          minimum: 1
        answeredBlocks:
          type: integer
          minimum: 0
        timedOutBlocks:
          type: integer
          minimum: 0
          description: Factual timeout count; interpretation belongs to S6a.
        currentBlockNumber:
          description: One-based randomized position, or null when status is COMPLETED.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
        revision:
          type: integer
          minimum: 0
          description: |
            Test-attempt revision only. It starts at zero and increments exactly
            once per block that becomes ANSWERED or TIMED_OUT. It never reuses or
            changes Application.revision.
        startedAt:
          type: string
          format: date-time
        completedAt:
          description: Completion time, or null while status is IN_PROGRESS.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    ForcedChoiceStatement:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          $ref: '#/components/schemas/TestStatementId'
        text:
          type: string
          minLength: 1
          maxLength: 500
    CurrentTestBlock:
      type: object
      additionalProperties: false
      required:
        - id
        - position
        - prompt
        - statements
        - timeLimitSeconds
        - startedAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/TestBlockId'
        position:
          type: integer
          minimum: 1
          description: One-based position in this attempt's persisted randomized block order.
        prompt:
          type: string
          minLength: 1
          maxLength: 500
        statements:
          type: array
          minItems: 4
          maxItems: 4
          description: Persisted randomized order for this attempt; private mappings are omitted.
          items:
            $ref: '#/components/schemas/ForcedChoiceStatement'
        timeLimitSeconds:
          type: integer
          minimum: 10
          maximum: 600
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absolute server deadline; at or after this instant timeout wins.
    CurrentTestBlockResponse:
      type: object
      additionalProperties: false
      required: [attempt, currentBlock, serverTime, timedOutOnThisRequest]
      example:
        attempt:
          id: 77777777-7777-4777-8777-777777777777
          applicationId: 55555555-5555-4555-8555-555555555555
          testVersion:
            id: 66666666-6666-4666-8666-666666666666
            version: 1
            title: Synthetic forced-choice demo
            description: Synthetic prototype content; not validated admissions science.
            publishedAt: '2026-09-21T00:00:00Z'
          status: IN_PROGRESS
          totalBlocks: 10
          answeredBlocks: 0
          timedOutBlocks: 0
          currentBlockNumber: 1
          revision: 0
          startedAt: '2026-09-21T00:05:00Z'
          completedAt: null
        currentBlock:
          id: block_01
          position: 1
          prompt: When a group discussion becomes difficult, I...
          statements:
            - id: statement_01_a
              text: Help participants hear one another even when views differ.
            - id: statement_01_b
              text: Wait for the disagreement to settle before becoming involved.
            - id: statement_01_c
              text: Bring the discussion back to the task that needs to be solved.
            - id: statement_01_d
              text: Make sure my own view is not lost in the discussion.
          timeLimitSeconds: 45
          startedAt: '2026-09-21T00:06:00Z'
          expiresAt: '2026-09-21T00:06:45Z'
        serverTime: '2026-09-21T00:06:00Z'
        timedOutOnThisRequest: false
      properties:
        attempt:
          $ref: '#/components/schemas/TestAttemptSummary'
        currentBlock:
          description: Active public block, or null after the attempt completes.
          oneOf:
            - $ref: '#/components/schemas/CurrentTestBlock'
            - type: 'null'
        serverTime:
          type: string
          format: date-time
          description: Server clock sample used to render the countdown without trusting device time.
        timedOutOnThisRequest:
          type: boolean
          description: True only when this call terminalized the prior active block as TIMED_OUT.
    SubmitTestBlockRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, mostStatementId, leastStatementId]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          description: Last TestAttempt.revision observed by the client.
        mostStatementId:
          $ref: '#/components/schemas/TestStatementId'
        leastStatementId:
          $ref: '#/components/schemas/TestStatementId'
    TestBlockOutcome:
      type: string
      enum: [ANSWERED, TIMED_OUT]
    SubmitTestBlockResult:
      type: object
      additionalProperties: false
      required: [blockId, outcome, resolvedAt]
      properties:
        blockId:
          $ref: '#/components/schemas/TestBlockId'
        outcome:
          $ref: '#/components/schemas/TestBlockOutcome'
        resolvedAt:
          type: string
          format: date-time
      description: Terminal result only; selected statement IDs are not echoed.
    SubmitTestBlockResponse:
      type: object
      additionalProperties: false
      required: [attempt, result, serverTime]
      example:
        attempt:
          id: 77777777-7777-4777-8777-777777777777
