openapi: 3.1.0
info:
  title: AI Leader ID API
  version: 0.2.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Canonical P0 HTTP contract. S0 health, S1 identity, S2 versioned
    application-draft, and S3 timed forced-choice operations are approved. S2 and
    S3 have no technical implementation yet. Extend this file before implementing
    video, submission, scoring, commission, feedback, or methodology endpoints.
    The pitch environment uses synthetic applicants and a real API.
servers:
  - url: /
    description: Relative to NEXT_PUBLIC_API_URL
tags:
  - name: Health
    description: Service availability checks.
  - name: Auth
    description: Applicant identity, session, and profile operations.
  - name: Application cycles
    description: Approved S2 application-cycle operations.
  - name: Applications
    description: Approved S2 versioned application-draft operations.
  - name: Forced-choice test
    description: Approved S3 timed forced-choice attempt operations.
security:
  - accessCookie: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      x-review-status: APPROVED
      summary: Check API health
      security: []
      responses:
        '200':
          description: API process is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerApplicant
      x-review-status: APPROVED
      summary: Register an applicant with synthetic identity data in the pitch environment
      security: []
      x-creates-role: APPLICANT
      description: |
        Public registration creates only an APPLICANT account and immediately starts
        a session. Email verification is outside P0. IIN is format-checked,
        encrypted before database storage, and never returned in this response.
        Existing email or IIN values return the same neutral error and must not be
        disclosed to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterApplicantRequest'
            example:
              email: contract-registration@example.test
              iin: '900000000000'
              fullName: Contract Registration Applicant
              birthYear: 2000
              password: synthetic-demo-passphrase
      responses:
        '201':
          description: Applicant created and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/RegistrationBadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-review-status: APPROVED
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: applicant@example.test
              password: synthetic-demo-passphrase
      responses:
        '200':
          description: Session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-review-status: APPROVED
      summary: Rotate the refresh token and create a new short-lived access session
      description: |
        Requires the refresh-token cookie and CSRF header. The server rotates the
        opaque refresh token, validates its PostgreSQL-backed session, and renews its
        seven-day TTL. The response never exposes either token in JSON.
      security:
        - refreshCookie: []
          csrfToken: []
      responses:
        '200':
          description: Session refreshed
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthenticationCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '403':
          $ref: '#/components/responses/CsrfValidationFailed'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-review-status: APPROVED
      summary: End all active sessions for the current user
      description: |
        Logout is conditional on the refresh cookie, and the condition is the
        whole point of this operation (D-018, CON-017).

        With no refresh cookie present the request is anonymous and idempotent:
        the server answers 204 without requiring CSRF, because there is no
        session to protect and nothing an attacker could achieve by forcing it.
        A caller that already lost its cookies must be able to finish logging
        out.

        With a refresh cookie present — valid, invalid or expired — CSRF
        validation is required and a failure is 403. The check happens before
        the cookie is resolved, so a caller cannot learn whether the session was
        still live by comparing responses.

        Every 204 clears the authentication cookies. A valid session
        additionally revokes every active session for that user. The response
        never reveals whether a session existed, whether it was expired, or whom
        it belonged to.

        A 403 changes nothing: cookies are left in place and no session is
        revoked. Clearing them on a failed CSRF check would let a forged request
        log a user out, which is the attack the check exists to prevent.
      security:
        - {}
        - refreshCookie: []
          csrfToken: []
      responses:
        '204':
          description: |
            Authentication cookies cleared. Returned for an anonymous call, for a
            valid session whose sessions were all revoked, and for a cookie that
            no longer resolves to one — the three are indistinguishable by design.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedAuthenticationCookies'
        '403':
          $ref: '#/components/responses/CsrfValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      x-review-status: APPROVED
      summary: Get the current user's non-sensitive profile
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /application-cycles/active:
    get:
      tags: [Application cycles]
      operationId: getActiveApplicationCycle
      x-review-status: APPROVED
      summary: Get the active cycle and published form version for a new draft
      description: |
        The absence of an active cycle is a normal product state with the stable
        code NO_ACTIVE_APPLICATION_CYCLE. It must remain distinguishable from an
        authentication, network, or server failure.
      x-roles: [APPLICANT]
      responses:
        '200':
          description: Active cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoActiveApplicationCycle'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications:
    post:
      tags: [Applications]
      operationId: createDraftApplication
      x-review-status: APPROVED
      summary: Create one draft for the active cycle
      x-roles: [APPLICANT]
      description: |
        The server binds the active cycle's immutable published form version.
        Test, video-prompt, and methodology bindings belong to later slices and
        are not part of the S2 draft contract. A second application for the same
        applicant and cycle returns APPLICATION_ALREADY_EXISTS rather than
        creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            example:
              cycleId: 11111111-1111-4111-8111-111111111111
      security:
        - accessCookie: []
          csrfToken: []
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoActiveApplicationCycle'
        '409':
          $ref: '#/components/responses/ApplicationAlreadyExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/current:
    get:
      tags: [Applications]
      operationId: getCurrentApplication
      x-review-status: APPROVED
      summary: Resume the applicant's application in the active cycle
      x-roles: [APPLICANT]
      description: |
        Returns the applicant's draft together with the exact immutable form
        version bound when the draft was created. If the authenticated applicant
        has no draft in the active cycle, the API returns APPLICATION_NOT_FOUND.
      responses:
        '200':
          description: Current application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/{applicationId}/answers:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    patch:
      tags: [Applications]
      operationId: saveDraftAnswers
      x-review-status: APPROVED
      summary: Save a partial set of answers to the bound form version
      x-roles: [APPLICANT]
      description: |
        Only the owner may change a DRAFT. The API validates question IDs and
        answer types and values against the application's bound form version.
        Supplied answer keys are merged; omitted keys remain unchanged. A null,
        blank trimmed text value, or empty multi-select value removes the stored
        answer. Submission completeness is checked by a later submission
        operation, not here. expectedRevision prevents stale autosave requests
        from silently overwriting newer work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAnswersRequest'
            example:
              formVersionId: 22222222-2222-4222-8222-222222222222
              expectedRevision: 3
              answers:
                current_education_status: undergraduate
                intended_study_area: Product management
                expected_graduation_year: 2027
                city_region: Almaty
      security:
        - accessCookie: []
          csrfToken: []
      responses:
        '200':
          description: Updated draft with an incremented revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDraft'
        '400':
          $ref: '#/components/responses/DraftAnswerBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ApplicationNotFound'
        '409':
          $ref: '#/components/responses/DraftConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /applications/{applicationId}/test-attempt:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    post:
      tags: [Forced-choice test]
      operationId: createTestAttempt
      x-review-status: APPROVED
      x-roles: [APPLICANT]
      summary: Create the application's only forced-choice attempt
      description: |
        Creates exactly one attempt for the authenticated applicant's owned DRAFT
        application. The server selects the immutable published TestVersion from
        the application's own ApplicationCycle, persists one randomized block order
        and one randomized statement order per block, and never uses the currently
        active global cycle as a substitute. S2 answers may still be empty or
        incomplete; S5 owns final completeness validation. Creating an attempt does
        not start the first block timer and does not change Application.revision.
      security:
        - accessCookie: []
          csrfToken: []
      responses:
        '201':
          description: Attempt created; no block timer has started yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAttemptSummary'
        '400':
          $ref: '#/components/responses/S3ValidationFailed'
        '401':
          $ref: '#/components/responses/S3Unauthorized'
        '403':
          $ref: '#/components/responses/S3MutationForbidden'
        '404':
          $ref: '#/components/responses/S3ApplicationNotFound'
        '409':
          $ref: '#/components/responses/S3CreateAttemptConflict'
        '500':
          $ref: '#/components/responses/S3InternalError'
    get:
      tags: [Forced-choice test]
      operationId: getTestAttempt
      x-review-status: APPROVED
      x-roles: [APPLICANT]
      summary: Get forced-choice attempt progress without answers or scores
      description: |
        Returns the attempt owned through the supplied application. Missing,
        not-yet-created, and foreign attempts use the same TEST_ATTEMPT_NOT_FOUND
        response. The response does not contain the active block text; the client
        uses startOrResumeCurrentTestBlock to obtain it without resetting its timer.
      security:
        - accessCookie: []
      responses:
        '200':
          description: Attempt progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestAttemptSummary'
        '400':
          $ref: '#/components/responses/S3ValidationFailed'
        '401':
          $ref: '#/components/responses/S3Unauthorized'
        '403':
          $ref: '#/components/responses/S3ReadForbidden'
        '404':
          $ref: '#/components/responses/S3TestAttemptNotFound'
        '500':
          $ref: '#/components/responses/S3InternalError'
  /test-attempts/{attemptId}/current-block:
    parameters:
      - $ref: '#/components/parameters/TestAttemptId'
    post:
      tags: [Forced-choice test]
      operationId: startOrResumeCurrentTestBlock
      x-review-status: APPROVED
      x-roles: [APPLICANT]
      summary: Start or resume the current timed block
      description: |
        Idempotently returns the already-active block or starts its deadline once.
        If the prior active deadline has passed, the same transaction records that
        block as TIMED_OUT, increments TestAttempt.revision once, and starts the next
        block unless the attempt is now complete. Repeated calls never reset a
        deadline and never increment revision merely for starting a block. A
        completed attempt returns currentBlock null. serverTime lets the browser
        render against server time instead of trusting its device clock.
      security:
        - accessCookie: []
          csrfToken: []
      responses:
        '200':
          description: Current block, or completed progress with no current block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentTestBlockResponse'
        '400':
          $ref: '#/components/responses/S3ValidationFailed'
        '401':
          $ref: '#/components/responses/S3Unauthorized'
        '403':
          $ref: '#/components/responses/S3MutationForbidden'
        '404':
          $ref: '#/components/responses/S3TestAttemptNotFound'
        '409':
          $ref: '#/components/responses/S3AdvanceAttemptConflict'
        '500':
          $ref: '#/components/responses/S3InternalError'
  /test-attempts/{attemptId}/blocks/{blockId}/response:
    parameters:
      - $ref: '#/components/parameters/TestAttemptId'
      - $ref: '#/components/parameters/TestBlockId'
    put:
      tags: [Forced-choice test]
      operationId: submitCurrentTestBlockResponse
      x-review-status: APPROVED
      x-roles: [APPLICANT]
      summary: Resolve the current block with one most/least pair or a timeout
      description: |
        Before expiry, stores one MOST_LIKE_ME and one different LEAST_LIKE_ME
        statement for the active block. At or after the server deadline it stores
        TIMED_OUT instead and returns that terminal outcome with 200; no late answer
        is retained. An exact retry of an already-answered pair returns its stored
        result, and any retry of a timed-out block returns TIMED_OUT. A different
        pair for an answered block returns TEST_BLOCK_LOCKED. The attempt's bound
        TestVersion is authoritative, so the client does not submit a version ID.
        This operation increments TestAttempt.revision once per newly terminal
        block and never changes Application.revision or starts the next timer.
      security:
        - accessCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTestBlockRequest'
            example:
              expectedRevision: 0
              mostStatementId: statement_01_a
              leastStatementId: statement_01_b
      responses:
        '200':
          description: Stored ANSWERED or TIMED_OUT terminal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitTestBlockResponse'
        '400':
          $ref: '#/components/responses/S3SubmitBlockBadRequest'
        '401':
          $ref: '#/components/responses/S3Unauthorized'
        '403':
          $ref: '#/components/responses/S3MutationForbidden'
        '404':
          $ref: '#/components/responses/S3TestAttemptNotFound'
        '409':
          $ref: '#/components/responses/S3SubmitBlockConflict'
        '500':
          $ref: '#/components/responses/S3InternalError'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-invision_access
      description: |
        HttpOnly, Secure, SameSite=Strict cookie containing a short-lived signed
        access token. Its session identifier must resolve to an active PostgreSQL session.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-invision_refresh
      description: |
        HttpOnly, Secure, SameSite=Strict opaque refresh-token cookie. Only a hash
        is stored in PostgreSQL. It is rotated on every refresh and has a seven-day
        TTL. Redis is not authoritative for authentication or authorization.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required with the authentication cookie on state-changing endpoints. Its
        value must equal the non-HttpOnly __Host-invision_csrf cookie set by the API.
  headers:
    AuthenticationCookies:
      description: |
        Sets three cookies: __Host-invision_access (HttpOnly, Secure,
        SameSite=Strict, Path=/, Max-Age=900); __Host-invision_refresh (HttpOnly,
        Secure, SameSite=Strict, Path=/, Max-Age=604800); and
        __Host-invision_csrf (Secure, SameSite=Strict, Path=/, readable by the
        frontend). Local development uses documented non-__Host equivalents over
        HTTP only.
      schema:
        type: string
    ClearedAuthenticationCookies:
      description: Clears the access, refresh, and CSRF cookies with Max-Age=0.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the caller may retry this rate-limited operation.
      schema:
        type: integer
        minimum: 1
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestAttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TestBlockId:
      name: blockId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TestBlockId'
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            code: VALIDATION_ERROR
            message: Request fields are invalid.
            details: {}
            traceId: req_demo_001
    RegistrationBadRequest:
      description: |
        Invalid request fields or a neutral registration failure. A duplicate email
        or IIN must return code REGISTRATION_FAILED with no field-level details;
        callers must not learn which identifier is already registered.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/RegistrationFailedError'
          examples:
            invalidFields:
              value:
                code: VALIDATION_ERROR
                message: Request fields are invalid.
                details:
                  fields:
                    email: [Must be a valid email address.]
                traceId: req_demo_001
            neutralRegistrationFailure:
              value:
                code: REGISTRATION_FAILED
                message: We could not create an account with these details.
                details: {}
                traceId: req_demo_007
    Unauthorized:
      description: Sign-in required or credentials invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            code: UNAUTHORIZED
            message: Authentication is required.
            details: {}
            traceId: req_demo_002
    InvalidCredentials:
      description: Invalid sign-in credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvalidCredentialsError'
          example:
            code: INVALID_CREDENTIALS
            message: We could not sign you in. Check your email and password and try again.
            details: {}
            traceId: req_demo_008
    CsrfValidationFailed:
      description: Required CSRF token is absent or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CsrfValidationFailedError'
          example:
            code: CSRF_VALIDATION_FAILED
            message: The request could not be verified.
            details: {}
            traceId: req_demo_010
    Forbidden:
      description: Role, assignment, or ownership does not permit this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
          example:
            code: FORBIDDEN
            message: Access is denied.
            details: {}
            traceId: req_demo_003
    NoActiveApplicationCycle:
      description: No application cycle currently accepts new drafts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoActiveApplicationCycleError'
          example:
            code: NO_ACTIVE_APPLICATION_CYCLE
            message: Applications are not currently open.
            details: {}
            traceId: req_demo_011
    ApplicationNotFound:
      description: |
        Application not found. The same response is used when an application
        exists but is not owned by the authenticated applicant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationNotFoundError'
          example:
            code: APPLICATION_NOT_FOUND
            message: Application was not found.
            details: {}
            traceId: req_demo_012
    ApplicationAlreadyExists:
      description: The applicant already has an application in this cycle
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApplicationAlreadyExistsError'
          example:
            code: APPLICATION_ALREADY_EXISTS
            message: An application already exists for this cycle.
            details: {}
            traceId: req_demo_013
    DraftAnswerBadRequest:
      description: A supplied draft answer does not match the bound form
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/UnknownQuestionError'
              - $ref: '#/components/schemas/InvalidAnswerTypeError'
              - $ref: '#/components/schemas/InvalidAnswerValueError'
          examples:
            unknownQuestion:
              value:
                code: UNKNOWN_QUESTION
                message: An answer references an unknown question.
                details:
                  questionId: unknown_question
                traceId: req_demo_014
            invalidAnswerType:
              value:
                code: INVALID_ANSWER_TYPE
                message: An answer has the wrong type.
                details:
                  questionId: expected_graduation_year
                traceId: req_demo_015
            invalidAnswerValue:
              value:
                code: INVALID_ANSWER_VALUE
                message: An answer is not valid for this question.
                details:
                  questionId: specialty
                traceId: req_demo_016
    DraftConflict:
      description: The draft cannot be updated in its current state
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ApplicationNotEditableError'
              - $ref: '#/components/schemas/FormVersionMismatchError'
              - $ref: '#/components/schemas/DraftRevisionConflictError'
          examples:
            applicationNotEditable:
              value:
                code: APPLICATION_NOT_EDITABLE
                message: The application can no longer be edited.
                details: {}
                traceId: req_demo_017
            formVersionMismatch:
              value:
                code: FORM_VERSION_MISMATCH
                message: The form version does not match this application.
                details: {}
                traceId: req_demo_018
            revisionConflict:
              value:
                code: DRAFT_REVISION_CONFLICT
                message: A newer version of this draft is already saved.
                details:
                  currentRevision: 4
                traceId: req_demo_019
    RateLimited:
      description: Too many authentication requests
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
          example:
            code: RATE_LIMITED
            message: Try again later.
            details: {}
            traceId: req_demo_006
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred. Try again later.
            details: {}
            traceId: req_demo_009
    S3ValidationFailed:
      description: A path or request value is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3ValidationError'
          example:
            code: VALIDATION_ERROR
            message: Request fields are invalid.
            details: {}
            traceId: req_s3_001
    S3Unauthorized:
      description: An active access session is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3UnauthorizedError'
          example:
            code: UNAUTHORIZED
            message: Authentication is required.
            details: {}
            traceId: req_s3_002
    S3ReadForbidden:
      description: The authenticated role cannot use this applicant operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3ReadForbiddenError'
          example:
            code: FORBIDDEN
            message: Access is denied.
            details: {}
            traceId: req_s3_003
    S3MutationForbidden:
      description: The role is forbidden or the same-origin CSRF check failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3MutationForbiddenError'
          examples:
            forbiddenRole:
              value:
                code: FORBIDDEN
                message: Access is denied.
                details: {}
                traceId: req_s3_004
            csrfFailure:
              value:
                code: CSRF_VALIDATION_FAILED
                message: The request could not be verified.
                details: {}
                traceId: req_s3_005
    S3ApplicationNotFound:
      description: |
        Application not found. The same response is used when the application
        exists but belongs to another applicant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3ApplicationNotFoundError'
          example:
            code: APPLICATION_NOT_FOUND
            message: Application was not found.
            details: {}
            traceId: req_s3_006
    S3TestAttemptNotFound:
      description: |
        Test attempt not found. The same response is used for an absent attempt
        and an attempt owned by another applicant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3TestAttemptNotFoundError'
          example:
            code: TEST_ATTEMPT_NOT_FOUND
            message: Test attempt was not found.
            details: {}
            traceId: req_s3_007
    S3CreateAttemptConflict:
      description: The application cannot create a new attempt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3CreateAttemptConflictError'
          examples:
            applicationNotEditable:
              value:
                code: APPLICATION_NOT_EDITABLE
                message: The application can no longer be edited.
                details: {}
                traceId: req_s3_008
            versionNotConfigured:
              value:
                code: TEST_VERSION_NOT_CONFIGURED
                message: A test is not configured for this application cycle.
                details: {}
                traceId: req_s3_009
            attemptAlreadyExists:
              value:
                code: TEST_ATTEMPT_ALREADY_EXISTS
                message: A test attempt already exists for this application.
                details: {}
                traceId: req_s3_010
    S3AdvanceAttemptConflict:
      description: An in-progress attempt cannot advance because its application is not editable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3AdvanceAttemptConflictError'
          example:
            code: APPLICATION_NOT_EDITABLE
            message: The application can no longer be edited.
            details: {}
            traceId: req_s3_011
    S3SubmitBlockBadRequest:
      description: The most/least selection is malformed or does not belong to the current block
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3SubmitBlockBadRequestError'
          examples:
            sameSelection:
              value:
                code: SAME_MOST_AND_LEAST
                message: Most-like and least-like selections must be different.
                details: {}
                traceId: req_s3_012
            unknownStatement:
              value:
                code: UNKNOWN_TEST_STATEMENT
                message: A selected statement is not in the current block.
                details: {}
                traceId: req_s3_013
    S3SubmitBlockConflict:
      description: The block cannot accept this response in its current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3SubmitBlockConflictError'
          examples:
            applicationNotEditable:
              value:
                code: APPLICATION_NOT_EDITABLE
                message: The application can no longer be edited.
                details: {}
                traceId: req_s3_014
            blockNotCurrent:
              value:
                code: TEST_BLOCK_NOT_CURRENT
                message: This is not the current test block.
                details: {}
                traceId: req_s3_015
            blockLocked:
              value:
                code: TEST_BLOCK_LOCKED
                message: This test block is already locked.
                details: {}
                traceId: req_s3_016
            revisionConflict:
              value:
                code: TEST_REVISION_CONFLICT
                message: Test progress has changed. Reload the current block.
                details:
                  currentRevision: 3
                traceId: req_s3_017
    S3InternalError:
      description: Unexpected server error with no private test content disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/S3InternalError'
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred. Try again later.
            details: {}
            traceId: req_s3_018
