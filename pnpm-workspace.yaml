packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. pnpm refuses the rest, so a new
# dependency that needs a build step is added here in the same pull request.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  msw: false
