services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invision
      POSTGRES_USER: invision
      POSTGRES_PASSWORD: invision
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invision -d invision"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    environment:
      ML_INTERNAL_TOKEN: local-internal-token
      GATEWAY_MODE: replay
      BUDGET_USD_CAP: "20"
      UPLOADS_DIR: /repo/context/fixtures/audio
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://invision:invision@postgres:5432/invision
      API_KEYS: local-platform:platform,local-interviewer:interviewer,local-commission:commission,local-admin:admin
      ML_SERVICE_URL: http://ml:8000
      ML_INTERNAL_TOKEN: local-internal-token
      DEMO_MODE: "true"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: mock
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
